<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>女性人体 · 3D 体表研究</title>
<style>
:root{color-scheme:light;--paper:#f5f4ef;--ink:#203b3c;--muted:#6a7978;--line:#d9dfd9;--accent:#17675d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;transition:background .15s}button:hover{background:#e3ece6}button:focus-visible,input:focus-visible{outline:3px solid #57aa96;outline-offset:2px}button.active{background:var(--accent);color:white;border-color:var(--accent)}header{height:82px;padding:15px 28px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}h1{font-size:21px;font-weight:600;margin:0}header p{margin:2px 0 0;color:var(--muted);font-size:12px}.badge{font-size:12px;border:1px solid #bad1c4;border-radius:20px;padding:6px 12px;color:var(--accent)}main{display:grid;grid-template-columns:268px 1fr;height:calc(100dvh - 82px);min-height:520px}aside{background:#fff;border-right:1px solid var(--line);padding:22px 20px;overflow-y:auto}h2{font-size:12px;letter-spacing:.08em;font-weight:600;color:var(--muted);margin:22px 0 10px}h2:first-child{margin-top:0}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.wide{width:100%;margin-top:7px}label.switch{display:flex;align-items:center;justify-content:space-between;margin:13px 0}label.switch input{accent-color:var(--accent);width:18px;height:18px}.help{font-size:12px;color:var(--muted);line-height:1.8}.note{background:#f2f5ef;border:1px solid #e1e7dc;border-radius:10px;padding:12px;font-size:12px;color:#5a6c60}.stage{position:relative;overflow:hidden}#viewport{width:100%;height:100%;touch-action:none}#viewport canvas{display:block;width:100%;height:100%}.stage-top{position:absolute;left:22px;top:18px;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--muted)}#view-name{font-size:23px;margin-top:3px}.stage-bottom{position:absolute;bottom:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:end;pointer-events:none;font-size:12px;color:#586e66}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);z-index:5;padding:30px;text-align:center}.spinner{width:26px;height:26px;border:2px solid #c9d8d0;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}#labels{position:absolute;inset:0;pointer-events:none}.landmark{position:absolute;background:#ffffffed;border:1px solid #acc1b5;border-radius:6px;padding:3px 7px;font-size:11px;white-space:nowrap;transform:translate(8px,-50%)}#message{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:#173e37e8;color:white;border-radius:8px;padding:8px 16px;font-size:12px;pointer-events:none;display:none;max-width:85%}.measure{margin:9px 0;font-size:12px;min-height:36px;color:var(--accent)}@media(max-width:760px){header{height:76px;padding:10px 15px}h1{font-size:17px}.badge{display:none}main{grid-template-columns:190px 1fr;height:calc(100dvh - 76px)}aside{padding:16px 12px}.buttons{gap:5px}button{font-size:12px;padding:8px 5px}.stage-top{left:12px}#view-name{font-size:18px}.stage-bottom{left:12px;right:12px;font-size:10px}}@media(max-width:480px){main{grid-template-columns:150px 1fr}.stage-bottom .hint{display:none}}
</style></head><body>
<header><div><h1>女性人体 · 3D 体表研究</h1><p>亚洲成年女性外观 · 可旋转的真实三维网格</p></div><span class="badge">体表样稿 01 · 离线查看</span></header>
<main><aside>
<h2>观察视角</h2><div class="buttons"><button data-view="front" class="active">正面</button><button data-view="back">背面</button><button data-view="left">左侧</button><button data-view="right">右侧</button></div>
<button class="wide" data-view="shoulder">肩背局部</button><button class="wide" id="reset">全身复位</button>
<h2>表面显示</h2><div class="buttons"><button data-mode="skin" class="active">自然肤色</button><button data-mode="clay">石膏研究</button></div>
<label class="switch">线框拓扑<input type="checkbox" id="wire"></label><label class="switch">示意观察点<input type="checkbox" id="markers"></label><label class="switch">地面网格<input type="checkbox" id="grid" checked></label><label class="switch">自动旋转<input type="checkbox" id="rotate"></label><label class="switch">透视观察<input type="checkbox" id="perspective"></label>
<h2>检查与导出</h2><button class="wide" id="measure">两点直线测距</button><div class="measure" id="measurement">点击表面选取两点；数值仅属于这个合成模型。</div><button class="wide" id="export">导出 4K PNG</button>
<h2>操作</h2><p class="help">左键拖动：旋转<br>滚轮：放大 / 缩小<br>右键拖动：平移<br>触屏：单指旋转，双指缩放</p>
<p class="note">体表概念样稿，未通过专业解剖校核。标记仅示意观察区域；本版不含内部骨骼、肌肉或医学测量数据。</p>
</aside><section class="stage" aria-label="可交互的三维人体"><div id="viewport"></div><div id="labels"></div><div class="stage-top"><div class="eyebrow">SURFACE ANATOMY / FEMALE</div><div id="view-name">正面观察</div></div><div class="stage-bottom"><span class="hint">拖动模型开始观察</span><span id="status">模型加载中</span></div><div id="loading"><div><div class="spinner"></div><div id="load-text">正在准备三维模型…</div></div></div><div id="message" role="status"></div></section></main>
<script>window.__MODEL_BASE64__='__MODEL_BASE64__';</script><script>/*__BUNDLE__*/</script>
</body></html>
